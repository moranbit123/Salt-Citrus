<title>Salt & Citrus — By Moran Blanga</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Heebo:wght@300;400;500;600;700&display=swap');

  :root{
    --paper:#FBF3E3;
    --paper-deep:#F4E9D2;
    --majolica:#1E5C74;
    --majolica-deep:#123B4C;
    --azure:#5C9CB5;
    --limone:#E8B23D;
    --limone-deep:#C98A1F;
    --bougain:#C24B6B;
    --ink:#22292C;
    --ink-soft:#5B6669;
    --white:#FFFDF7;
    --shadow: 0 10px 30px rgba(18,59,76,0.12);
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Heebo',sans-serif;
    background:var(--paper);
    color:var(--ink);
    direction:rtl;
    min-height:100vh;
    padding-bottom:110px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
    html{scroll-behavior:auto;}
  }

  /* ── HERO ── */
  .hero{position:relative; height:340px; overflow:hidden;}
  .hero img{width:100%;height:100%;object-fit:cover;object-position:center 40%; display:block; filter:brightness(0.78) saturate(1.05);}
  .hero-overlay{position:absolute; inset:0; background:linear-gradient(180deg, rgba(18,59,76,0.35) 0%, rgba(18,59,76,0.05) 40%, rgba(18,59,76,0.75) 100%);}
  .hero-content{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:0 24px 22px; text-align:center; color:var(--white);}
  .hero-eyebrow{font-size:0.68rem; font-weight:500; letter-spacing:0.28em; text-transform:uppercase; opacity:0.88; margin-bottom:8px; direction:ltr;}
  .hero-title{font-family:'Frank Ruhl Libre', serif; font-style:italic; font-weight:400; font-size:2.6rem; line-height:1.15; text-shadow:0 2px 18px rgba(0,0,0,0.35); direction:ltr;}
  .hero-byline{margin-top:10px; font-size:0.78rem; font-weight:300; font-style:italic; letter-spacing:0.02em; opacity:0.88; direction:ltr;}

  /* ── TABS ── */
  .tabs-wrap{position:sticky; top:0; z-index:20; background:var(--paper);}
  .tabs{display:flex; gap:6px; overflow-x:auto; padding:14px 16px 12px; scrollbar-width:none; direction:ltr;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    font-family:'Heebo',sans-serif;
    font-size:0.83rem;
    font-weight:500;
    padding:9px 18px;
    border-radius:999px;
    border:1.5px solid rgba(30,92,116,0.25);
    background:var(--white);
    color:var(--majolica-deep);
    cursor:pointer;
    white-space:nowrap;
    transition:background 0.2s, color 0.2s, border-color 0.2s, transform 0.15s;
  }
  .tab:active{transform:scale(0.96);}
  .tab.active{background:#F0C458; color:var(--majolica-deep); border-color:#F0C458; font-weight:700;}
  .tabs-divider{height:1px; background:repeating-linear-gradient(90deg, rgba(30,92,116,0.35) 0 8px, transparent 8px 14px);}

  /* ── CONTENT ── */
  .content{padding:18px 16px 8px;}
  .empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft);}
  .empty-state .emoji{font-size:2.4rem; margin-bottom:12px; display:block;}
  .empty-state p{font-size:0.95rem; line-height:1.6;}
  .empty-state .add-link{color:var(--majolica); font-weight:600; text-decoration:underline; cursor:pointer;}

  /* ── RECIPE CARD ── */
  .card{
    background:var(--white);
    border-radius:16px;
    margin-bottom:16px;
    box-shadow:var(--shadow);
    overflow:hidden;
    border:1px solid rgba(30,92,116,0.08);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    cursor:pointer;
  }
  .card-thumb{
    width:52px; height:52px; border-radius:12px; flex:0 0 auto;
    object-fit:cover;
    background:linear-gradient(135deg, var(--limone), var(--limone-deep));
    display:flex; align-items:center; justify-content:center;
    font-size:1.5rem;
  }
  .card-thumb img{width:100%;height:100%;object-fit:cover;border-radius:12px;}
  .card-titles{flex:1; min-width:0;}
  .card-name{font-family:'Frank Ruhl Libre', serif; font-size:1.12rem; font-weight:500; line-height:1.3;}
  .card-meta{display:flex; align-items:center; gap:6px; margin-top:4px;}

  /* tile stamp (signature detail) */
  .stamp{
    width:20px; height:20px; border-radius:5px; flex:0 0 auto;
    background:
      linear-gradient(45deg, var(--majolica) 25%, transparent 25.5%, transparent 75%, var(--majolica) 75.5%),
      linear-gradient(45deg, var(--majolica) 25%, var(--azure) 25.5%, var(--azure) 75%, var(--majolica) 75.5%);
    background-size:10px 10px;
    background-position:0 0, 5px 5px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 1.5px var(--white), 0 0 0 2.5px rgba(30,92,116,0.3);
  }
  .stamp span{font-size:0.55rem; font-weight:700; color:var(--white); text-shadow:0 1px 1px rgba(0,0,0,0.4);}
  .card-owner{font-size:0.74rem; color:var(--ink-soft); font-weight:400;}

  .chevron{flex:0 0 auto; color:var(--majolica); transition:transform 0.25s; font-size:0.9rem;}
  .card.open .chevron{transform:rotate(180deg);}

  .card-body{max-height:0; overflow:hidden; transition:max-height 0.3s ease;}
  .card.open .card-body{max-height:1400px;}
  .card-body-inner{padding:0 16px 20px;}
  .card-photo-full{width:100%; border-radius:12px; margin-bottom:14px; display:block; object-fit:cover; max-height:220px;}

  .section-label{font-size:0.68rem; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--majolica); margin-bottom:8px; display:flex; align-items:center; gap:6px;}
  .section-label::before{content:''; width:14px; height:1.5px; background:var(--limone-deep); display:inline-block;}

  .ingredients{list-style:none; margin-bottom:18px;}
  .ingredients li{
    position:relative;
    padding:6px 0 6px 0;
    font-size:0.9rem;
    line-height:1.5;
    border-bottom:1px dashed rgba(30,92,116,0.15);
  }
  .ingredients li:last-child{border-bottom:none;}
  .instructions{font-size:0.9rem; line-height:1.75; color:var(--ink); white-space:pre-line;}

  /* ── FAB ── */
  .fab{
    position:fixed;
    left:20px; bottom:24px;
    width:58px; height:58px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--limone), var(--limone-deep));
    color:var(--majolica-deep);
    font-size:1.8rem;
    font-weight:600;
    border:none;
    box-shadow:0 8px 24px rgba(201,138,31,0.45), 0 0 0 4px var(--white);
    cursor:pointer;
    z-index:30;
    display:flex; align-items:center; justify-content:center;
    transition:transform 0.15s;
  }
  .fab:active{transform:scale(0.92);}

  /* ── MODAL ── */
  .overlay{
    position:fixed; inset:0; background:rgba(18,26,29,0.55);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.25s; z-index:50;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .sheet{
    background:var(--paper); width:100%; max-width:480px;
    border-radius:22px 22px 0 0;
    max-height:88vh; overflow-y:auto;
    transform:translateY(100%); transition:transform 0.3s ease;
    padding:22px 20px 30px;
  }
  .overlay.open .sheet{transform:translateY(0);}
  .sheet-handle{width:40px; height:4px; background:rgba(30,92,116,0.25); border-radius:4px; margin:0 auto 18px;}
  .sheet-title{font-family:'Frank Ruhl Libre', serif; font-style:italic; font-size:1.4rem; margin-bottom:18px; color:var(--majolica-deep);}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:0.78rem; font-weight:600; color:var(--majolica-deep); margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; border:1.5px solid rgba(30,92,116,0.2); border-radius:10px;
    padding:10px 12px; font-family:'Heebo',sans-serif; font-size:0.92rem;
    background:var(--white); color:var(--ink); resize:vertical;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--limone-deep); outline-offset:1px; border-color:var(--majolica);}
  .field textarea{min-height:80px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}

  .photo-input-wrap{
    border:1.5px dashed rgba(30,92,116,0.3); border-radius:12px; padding:14px;
    text-align:center; font-size:0.82rem; color:var(--ink-soft); cursor:pointer;
    background:var(--white);
  }
  .photo-preview{width:100%; max-height:140px; object-fit:cover; border-radius:10px; margin-top:10px; display:none;}

  .btn-row{display:flex; gap:10px; margin-top:20px;}
  .btn{
    flex:1; padding:13px; border-radius:12px; border:none; font-family:'Heebo',sans-serif;
    font-size:0.92rem; font-weight:600; cursor:pointer; transition:transform 0.15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--majolica); color:var(--white);}
  .btn-secondary{background:transparent; color:var(--ink-soft); border:1.5px solid rgba(30,92,116,0.2);}

  .tip-tag{
    display:inline-block; font-size:0.68rem; font-weight:700; letter-spacing:0.06em;
    background:rgba(194,75,107,0.12); color:var(--bougain); padding:3px 10px; border-radius:999px;
    margin-bottom:8px;
  }
</style>
</head>

        'מבשלים על אש בינונית-גבוהה כשעתיים, עד שהפלפלים מתרככים היטב. אם המים יורדים בחצי והפלפלים עדיין לא רכים מספיק, מוסיפים עוד מים עד כיסוי הסיר. זמן בישול מקסימלי: 3-4 שעות סה"כ.',
        'בסוף מצפים לקרמל עדין (לא צבע ענבר כהה מדי - אחרת הריבה עלולה להיות מרירה), ולא מצומצם מדי - אחרת כשהריבה תתקרר היא תהיה קשה מאוד. משאירים מעט נוזלים בתחתית הסיר.',
        'שומרים במקרר - נשמרת מצוין גם חודש-חודשיים.',
        'טיפ: הפלפלים חריפים מאוד בשלב הזה ולכן הריבה תצא חריפה מאוד. למי שלא אוהב חריף במיוחד - אפשר להחליף חצי מכמות הפלפלים בפלפל גמבה אדום (חצי ק"ג פלפלים חריפים + 2 ק"ג גמבה אדומה).'
      ].join('\n\n')
    }
  ];

  let recipes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  (function mergeSeeds(){
    const existingIds = new Set(recipes.map(r => r.id));
    let changed = false;
    SEED_RECIPES.forEach(seed => {
      if(!existingIds.has(seed.id)){
        recipes.push(seed);
        changed = true;
      }
    });
    if(changed) localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes));
  })();

  let activeTab = categories[0];
  let openCardId = null;
  let pendingPhoto = null;

  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes)); }

  function renderTabs(){
    const bar = document.getElementById('tabsBar');
    bar.innerHTML = categories.map(c =>
      `<button class="tab ${c===activeTab?'active':''}" onclick="setTab('${c}')">${c}</button>`
    ).join('');
  }

  function setTab(c){ activeTab = c; openCardId = null; renderTabs(); renderContent(); }

  function renderContent(){
    const el = document.getElementById('content');
    const list = recipes.filter(r => r.category === activeTab);

    if(list.length === 0){
      el.innerHTML = `
        <div class="empty-state">
          <span class="emoji">🍋</span>
          <p>אין עדיין מתכונים ב"${activeTab}"<br>
          <span class="add-link" onclick="openModal()">הוסיפי את הראשון</span></p>
        </div>`;
      return;
    }

    el.innerHTML = list.map(r => {
      const isOpen = openCardId === r.id;
      const thumb = r.photo
        ? `<div class="card-thumb"><img src="${r.photo}"></div>`
        : `<div class="card-thumb">${r.emoji || '🍋'}</div>`;
      const fullPhoto = r.photo ? `<img class="card-photo-full" src="${r.photo}">` : '';
      const ingList = (r.ingredients||'').split('\n').filter(Boolean).map(i => `<li>${escapeHtml(i)}</li>`).join('');
      const initial = (r.owner||'?').trim().charAt(0);

      if(r.category === 'Tips'){
        return `
        <div class="card ${isOpen?'open':''}">
          <div class="card-head" onclick="toggleCard('${r.id}')">
            <div class="card-thumb">${r.emoji || '💡'}</div>
            <div class="card-titles">
              <div class="card-name">${escapeHtml(r.name)}</div>
              <div class="card-meta">
                <div class="stamp"><span>${initial}</span></div>
                <span class="card-owner">${escapeHtml(r.owner||'')}</span>
              </div>
            </div>
            <div class="chevron">▾</div>
          </div>
          <div class="card-body">
            <div class="card-body-inner">
              ${fullPhoto}
              <span class="tip-tag">טיפ</span>
              <p class="instructions">${escapeHtml(r.instructions||'')}</p>
            </div>
          </div>
        </div>`;
      }

      return `
      <div class="card ${isOpen?'open':''}">
        <div class="card-head" onclick="toggleCard('${r.id}')">
          ${thumb}
          <div class="card-titles">
            <div class="card-name">${escapeHtml(r.name)}</div>
            <div class="card-meta">
              <div class="stamp"><span>${initial}</span></div>
              <span class="card-owner">${escapeHtml(r.owner||'')}</span>
            </div>
          </div>
          <div class="chevron">▾</div>
        </div>
        <div class="card-body">
          <div class="card-body-inner">
            ${fullPhoto}
            <div class="section-label">מצרכים</div>
            <ul class="ingredients">${ingList}</ul>
            <div class="section-label">אופן ההכנה</div>
            <p class="instructions">${escapeHtml(r.instructions||'')}</p>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function toggleCard(id){ openCardId = openCardId === id ? null : id; renderContent(); }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.innerText = str;
    return d.innerHTML;
  }

  function openModal(){ document.getElementById('modalOverlay').classList.add('open'); }
  function closeModal(){
    document.getElementById('modalOverlay').classList.remove('open');
    ['f-name','f-owner','f-ingredients','f-instructions','f-emoji'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-category').value = categories[0];
    document.getElementById('photoPreview').style.display = 'none';
    pendingPhoto = null;
  }

  function handlePhoto(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      pendingPhoto = ev.target.result;
      const prev = document.getElementById('photoPreview');
      prev.src = pendingPhoto;
      prev.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }

  function addRecipe(){
    const name = document.getElementById('f-name').value.trim();
    const owner = document.getElementById('f-owner').value.trim();
    const category = document.getElementById('f-category').value;
    const ingredients = document.getElementById('f-ingredients').value.trim();
    const instructions = document.getElementById('f-instructions').value.trim();
    const emoji = document.getElementById('f-emoji').value.trim();

    if(!name || !instructions){
      alert('נא למלא לפחות שם ואופן הכנה');
      return;
    }

    recipes.unshift({
      id: Date.now().toString(),
      name, owner, category, ingredients, instructions, emoji,
      photo: pendingPhoto
    });
    save();
    closeModal();
    activeTab = category;
    renderTabs();
    renderContent();
  }

  renderTabs();
  renderContent();
</script>
</body>
</html>
